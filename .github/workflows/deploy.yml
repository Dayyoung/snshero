name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo docker system prune -af || true
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --no-save @rollup/rollup-linux-x64-gnu || true

      - name: Build Application
        run: npm run build
        env:
          VITE_BASE_PATH: /
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Post-Build Workspace Cleanup (Free Disk & Prune Unused Raw Scratch Assets)
        run: |
          echo "=== Cleaning up build workspace & unreferenced intermediate raw folders in dist/ ==="
          rm -rf .git
          rm -rf node_modules
          rm -rf ~/.npm
          rm -rf dist/anime-character-sheets/raw_ufotable_solo
          rm -rf dist/anime-character-sheets/raw_solo_regenerated
          rm -rf dist/anime-character-sheets/videos
          echo "=== Final dist/ Size & Remaining Disk Space ==="
          du -sh dist
          df -h

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
          error_count: 25
          reporting_interval: 10000
